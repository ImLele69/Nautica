# starting values, tune them on your server
# speeds are in blocks per tick (0.5 = 10 blocks per second)

# file in plugins/Nautica/lang/ without .yml, en and it are bundled
language: en

ship-size:
  max-blocks: 1500
  max-width: 24
  max-length: 64
  max-height: 32

movement:
  update-ticks: 1
  max-speed-cap: 0.6
  acceleration: 0.004
  deceleration: 0.002
  # degrees per tick at full speed
  turn-rate-max: 3.0
  # fraction of max speed for half, full and flank
  gears: [0.45, 0.75, 1.0]
  reverse-fraction: 0.3
  # heavier than this accelerates and turns slower, lighter is quicker
  reference-tonnage: 300
  # sail/tonnage ratio past which more sail stops helping
  sail-ratio-for-full-speed: 0.25
  # speed with no sail at all, as a fraction of max speed
  bare-hull-factor: 0.15

render:
  teleport-duration: 2
  # how often display rotations get updated while turning, in ticks
  rotation-update-ticks: 2
  # view distance multiplier (1.0 = 64 blocks)
  view-range: 1.5
  # height of a seated player relative to the bottom of the seat cell
  seat-y-offset: -0.4
  # extra yaw in degrees for blocks rendered as items, per kind. eyeball it in game
  item-yaw-offset:
    chest: 0
    bed: 0
    banner: 0
    head: 0
    pot: 0

feel:
  wind: true
  bobbing: true
  roll-on-turn: true
  particles: true
  sounds: true
  hud: true
  wind-bossbar: true
  bob-amplitude: 0.06
  bob-period-ticks: 80
  roll-max-degrees: 4.0
  storm-multiplier: 2.2

safety:
  snapshot-checkpoint-seconds: 10
  require-claim-permission: true
  passengers-crew-only: false
  # old snapshots kept in archive/ per ship
  archive-keep: 5
  # fraction of blocks that must match on recovery to say the ship is already there
  match-threshold: 0.9

blocks:
  # tags start with #, resolved at startup. unknown entries get skipped with a warning
  allowed:
    - "#planks"
    - "#logs"
    - "#wooden_slabs"
    - "#wooden_stairs"
    - "#wooden_fences"
    - "#fence_gates"
    - "#wooden_trapdoors"
    - "#wooden_doors"
    - "#wooden_buttons"
    - "#wooden_pressure_plates"
    - "#bamboo_blocks"
    - "#wool"
    - "#wool_carpets"
    - "#banners"
    - "#all_signs"
    - "#beds"
    - "#candles"
    - "#flower_pots"
    - "#terracotta"
    - "#anvil"
    - "#trapdoors"
    - chest
    - trapped_chest
    - barrel
    - ender_chest
    - crafting_table
    - cartography_table
    - fletching_table
    - smithing_table
    - loom
    - stonecutter
    - furnace
    - smoker
    - blast_furnace
    - brewing_stand
    - cauldron
    - water_cauldron
    - composter
    - lectern
    - bookshelf
    - chiseled_bookshelf
    - jukebox
    - note_block
    - decorated_pot
    - bell
    - campfire
    - soul_campfire
    - lantern
    - soul_lantern
    - torch
    - wall_torch
    - soul_torch
    - soul_wall_torch
    - redstone_torch
    - redstone_wall_torch
    - end_rod
    - chain
    - iron_bars
    - ladder
    - scaffolding
    - hay_block
    - sea_lantern
    - glowstone
    - jack_o_lantern
    - lightning_rod
    - player_head
    - player_wall_head
    - skeleton_skull
    - skeleton_wall_skull
    - zombie_head
    - zombie_wall_head
    - creeper_head
    - creeper_wall_head
    - glass
    - glass_pane
    - tinted_glass
    - stone
    - cobblestone
    - stone_bricks
    - iron_block
    - copper_block
    - gold_block
  # ships sail through these and can dock over them, anything else stops the ship
  passable:
    - air
    - cave_air
    - void_air
    - water
    - bubble_column
    - kelp
    - kelp_plant
    - seagrass
    - tall_seagrass
    - lily_pad
  # weight for tonnage. exact materials win over tags, anything else weighs 1.0
  weights:
    "#wool": 0.3
    "#wool_carpets": 0.1
    "#banners": 0.3
    "#planks": 1.0
    "#logs": 1.2
    stone: 3.0
    cobblestone: 3.0
    stone_bricks: 3.0
    iron_block: 4.0
    copper_block: 4.0
    gold_block: 5.0
    anvil: 6.0
  # blocks that count as sail when they're above the deck
  sail:
    - "#wool"
    - "#banners"

modules:
  sails:
    # sail area multiplier per level
    multiplier: [1.15, 1.3, 1.5]
    cost:
      1: ["white_wool:16", "string:16"]
      2: ["white_wool:32", "string:32", "lead:4"]
      3: ["phantom_membrane:8", "white_wool:32"]
  helm:
    # turn rate multiplier. level 3 is the wheel and can turn while stopped
    multiplier: [1.2, 1.4, 1.4]
    standstill-turn: 0.8
    cost:
      1: ["oak_planks:16", "iron_ingot:4"]
      2: ["iron_ingot:12", "copper_ingot:8"]
      3: ["copper_block:4", "iron_block:2"]
  oars:
    # minimum speed with no wind, blocks per tick
    min-speed: 0.12
    cost:
      1: ["oak_planks:32", "stick:16"]
  steam:
    # speed regardless of wind, blocks per tick
    speed: 0.4
    # seconds of power per coal taken from furnaces on board
    seconds-per-fuel: 30
    cost:
      1: ["furnace:2", "copper_block:4", "iron_block:2"]
  anchor:
    cost:
      1: ["chain:8", "iron_block:1"]
  compass:
    cost:
      1: ["compass:1", "map:1", "cartography_table:1"]
  heart:
    cost:
      1: ["heart_of_the_sea:1", "nautilus_shell:4"]

recipes:
  enabled: true
