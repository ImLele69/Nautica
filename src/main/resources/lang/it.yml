  anchor-down: "<gray>Ancora calata."
  anchor-up: "<gray>Ancora salpata."
  shoaling: "<yellow>Fondale basso davanti!"
  grounded: "<red>Incagliata. Vai indietro per liberarti."
  blocked: "<red>Ostacolo!"
  waypoint-reached: "<green>Rotta raggiunta."
  no-fuel: "<yellow>Il motore a vapore e' senza carbone."

