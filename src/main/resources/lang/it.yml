  claim: "<prefix><red>Non puoi portare via il blocco a <x> <y> <z>."
  two-helms: "<prefix><red>Questa nave ha due timoni: togli quello a <x> <y> <z>."
  too-many: "<prefix><red>La nave supera i <max> blocchi. Controlla che non tocchi il molo."
  too-large: "<prefix><red>La nave supera le dimensioni massime (<length> x <width> x <height>)."
  unloaded: "<prefix><red>La nave arriva in una zona non caricata (<x>, <z>)."
