prefix: "<dark_aqua>⚓</dark_aqua> "

no-permission: "<prefix><red>Non hai il permesso."
players-only: "<prefix><red>Solo un giocatore puo' usare questo comando."
not-owner: "<prefix><red>Non sei il proprietario di questa nave."
no-ship-near: "<prefix><red>Nessuna nave tua qui vicino."
unknown-player: "<prefix><red>Giocatore sconosciuto: <player>"

ship:
  default-name: "Nave di <player>"

state:
  docked: "ormeggiata"
  assembling: "in partenza"
  sailing: "in viaggio"
  docking: "in ormeggio"
  virtual_port: "porto virtuale"

helm:
  orphan: "<prefix><red>Questo timone non appartiene a nessuna nave. Raccoglilo e piazzalo di nuovo."
  not-crew: "<prefix><red>Non sei nell'equipaggio di <ship>."
  busy: "<prefix><red>La nave non e' disponibile in questo momento."
  adopted: "<prefix><green>Timone assegnato a una nuova nave: <ship>."

assemble:
  started: "<gray>Assemblaggio di <blocks> blocchi..."
